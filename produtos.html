
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Gerenciar Produtos</title>
    <style>
        * {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f4f4f4;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: #fff;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        input, button {
            width: 100%;
            margin: 8px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .produto {
            background: white;
            width: 280px;
            padding: 15px;
            margin: 10px auto;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
        }
        .encerrado-overlay {
            position: absolute;
            top: 0;
            left: 0;
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            font-weight: bold;
            width: 100%;
            text-align: center;
            padding: 10px;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="form-titulo">Adicionar Produto</h2>
        <input type="text" id="nome" placeholder="Nome do Produto">
        <input type="text" id="logoLoja" placeholder="URL do Logo da Loja">
        <input type="text" id="preco" placeholder="Preço">
        <input type="text" id="imagem" placeholder="URL da Imagem do Produto">
        <input type="text" id="link" placeholder="Link do Produto">
        <input type="text" id="cupom" placeholder="Cupom (opcional)">
        <input type="text" id="descricao" placeholder="Descrição do Produto">
        <button id="salvar">Adicionar</button>
    </div>

    <h2>Produtos Adicionados</h2>
    <div id="lista-produtos"></div>

    <script type="module">
        // Firebase Config
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
  apiKey: "AIzaSyBKBfq3LVRX9CWchlx4Xl-1k03NxEjXhMU",
  authDomain: "garimpatudo-c1d44.firebaseapp.com",
  databaseURL: "https://garimpatudo-c1d44-default-rtdb.firebaseio.com",
  projectId: "garimpatudo-c1d44",
  storageBucket: "garimpatudo-c1d44.firebasestorage.app",
  messagingSenderId: "1095541536253",
  appId: "1:1095541536253:web:3ca5da84d0fff9fc9c1594",
  measurementId: "G-NCMPX8LH01"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let editandoId = null;

        document.getElementById("salvar").addEventListener("click", salvarProduto);

        async function salvarProduto() {
            const nome = document.getElementById("nome").value.trim();
            const logoLoja = document.getElementById("logoLoja").value.trim();
            let preco = document.getElementById("preco").value.trim();
            const imagem = document.getElementById("imagem").value.trim();
            const link = document.getElementById("link").value.trim();
            const cupom = document.getElementById("cupom").value.trim() || "Sem cupom";
            const descricao = document.getElementById("descricao").value.trim();

            if (!nome || !logoLoja || !preco || !imagem || !link || !descricao) {
                alert("Preencha todos os campos obrigatórios!");
                return;
            }

            preco = parseFloat(preco).toFixed(2).replace(".", ",");

            const dadosProduto = {
                nome,
                logoLoja,
                preco,
                imagem,
                link,
                cupom,
                descricao,
                status: "ativo",
                timestamp: serverTimestamp()
            };

            try {
                if (editandoId) {
                    const produtoRef = doc(db, "produtos", editandoId);
                    delete dadosProduto.timestamp; // Não sobrescreve o timestamp na edição
                    await updateDoc(produtoRef, dadosProduto);
                    alert("Produto atualizado com sucesso!");
                    editandoId = null;
                    document.getElementById("form-titulo").innerText = "Adicionar Produto";
                    document.getElementById("salvar").innerText = "Adicionar";
                } else {
                    await addDoc(collection(db, "produtos"), dadosProduto);
                    alert("Produto adicionado com sucesso!");
                }
                limparCampos();
            } catch (error) {
                console.error("Erro:", error);
            }
        }

        function limparCampos() {
            document.getElementById("nome").value = "";
            document.getElementById("logoLoja").value = "";
            document.getElementById("preco").value = "";
            document.getElementById("imagem").value = "";
            document.getElementById("link").value = "";
            document.getElementById("cupom").value = "";
            document.getElementById("descricao").value = "";
        }

        function carregarProdutos() {
            const listaProdutos = document.getElementById("lista-produtos");

            const q = query(collection(db, "produtos"), orderBy("timestamp", "desc"));

            onSnapshot(q, (snapshot) => {
                listaProdutos.innerHTML = "";  
                snapshot.forEach((docSnap) => {
                    const produto = docSnap.data();
                    const id = docSnap.id;
                    const produtoDiv = document.createElement("div");
                    produtoDiv.classList.add("produto");

                    produtoDiv.innerHTML = `
                        <img src="${produto.imagem}" alt="${produto.nome}" style="width: 100px;">
                        <p><strong>${produto.nome}</strong></p>
                        <img src="${produto.logoLoja}" alt="Logo da Loja" style="width: 60px; height: auto; margin: 5px 0;">
                        <p>Descrição: ${produto.descricao}</p>
                        <p>Preço: R$ ${produto.preco}</p>
                        <p><a href="${produto.link}" target="_blank">Ver Produto</a></p>
                        <p>Cupom: ${produto.cupom}</p>
                        <p>Status: <span id="status-${id}">${produto.status}</span></p>
                        <button class="btn-excluir" data-id="${id}">Excluir</button>
                        <button class="btn-editar" data-id="${id}">Editar</button>
                        <button class="btn-encerrar" data-id="${id}" ${produto.status === "encerrado" ? "disabled" : ""}>Encerrar Oferta</button>
                        <div class="encerrado-overlay" id="overlay-${id}" style="display: ${produto.status === 'encerrado' ? 'block' : 'none'}">ENCERRADO</div>
                    `;

                    listaProdutos.appendChild(produtoDiv);
                });

                document.querySelectorAll(".btn-excluir").forEach(button => {
                    button.addEventListener("click", () => excluirProduto(button.dataset.id));
                });

                document.querySelectorAll(".btn-editar").forEach(button => {
                    button.addEventListener("click", () => editarProduto(button.dataset.id));
                });

                document.querySelectorAll(".btn-encerrar").forEach(button => {
                    button.addEventListener("click", () => encerrarOferta(button.dataset.id));
                });
            });
        }

        async function excluirProduto(id) {
            if (confirm("Tem certeza que deseja excluir este produto?")) {
                try {
                    await deleteDoc(doc(db, "produtos", id));
                    alert("Produto excluído!");
                } catch (error) {
                    console.error("Erro ao excluir produto:", error);
                }
            }
        }

        async function editarProduto(id) {
            const docRef = doc(db, "produtos", id);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const produto = docSnap.data();
                document.getElementById("nome").value = produto.nome;
                document.getElementById("logoLoja").value = produto.logoLoja;
                document.getElementById("preco").value = produto.preco.replace(",", ".");
                document.getElementById("imagem").value = produto.imagem;
                document.getElementById("link").value = produto.link;
                document.getElementById("cupom").value = produto.cupom;
                document.getElementById("descricao").value = produto.descricao;

                editandoId = id;
                document.getElementById("form-titulo").innerText = "Editar Produto";
                document.getElementById("salvar").innerText = "Salvar Alterações";
            } else {
                alert("Produto não encontrado!");
            }
        }

        async function encerrarOferta(id) {
            const statusSpan = document.getElementById(`status-${id}`);
            const overlayDiv = document.getElementById(`overlay-${id}`);
            const encerrarBtn = document.querySelector(`.btn-encerrar[data-id="${id}"]`);

            if (statusSpan && overlayDiv && encerrarBtn) {
                statusSpan.textContent = "encerrado";
                overlayDiv.style.display = "block";
                encerrarBtn.disabled = true;
            }

            try {
                await updateDoc(doc(db, "produtos", id), { status: "encerrado" });
                alert("Oferta encerrada!");
            } catch (error) {
                console.error("Erro ao encerrar oferta:", error);
                alert("Erro ao encerrar a oferta. Tente novamente.");
            }
        }

        carregarProdutos();
    </script>
</body>
</html>
